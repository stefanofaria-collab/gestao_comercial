name: Atualizar indicadores de clientes

on:
  workflow_dispatch:
    inputs:
      executor:
        description: "Onde executar esta sincronizacao?"
        type: choice
        required: true
        default: ubuntu
        options:
          - ubuntu
          - github

  schedule:
    # 08:00 em São Paulo = 11:00 UTC.
    - cron: "0 11 * * *"

permissions:
  contents: read

concurrency:
  group: clickdados-atualizacao-indicadores
  cancel-in-progress: false

jobs:
  atualizar:
    name: Atualizar Supabase
    # Escolha manual "github" para testar sem Linux.
    # Somente depois de validar a sincronizacao completa, configure
    # CLICKDADOS_GITHUB_HOSTED_SCHEDULE=true em Actions > Variables para usar
    # o runner do GitHub tambem na execucao agendada.
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.executor == 'github') || (github.event_name == 'schedule' && vars.CLICKDADOS_GITHUB_HOSTED_SCHEDULE == 'true')) && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64","clickdados-rds"]') }}
    timeout-minutes: 60

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Diagnosticar acesso ao MySQL de origem
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
        run: |
          python - <<'PY'
          import os
          import socket
          import sys

          host = os.getenv("DB_HOST", "").strip()
          if not host:
              print("::error::Configure DB_HOST em Settings > Secrets and variables > Actions.")
              sys.exit(1)
          try:
              port = int(os.getenv("DB_PORT") or "3306")
              with socket.create_connection((host, port), timeout=12):
                  print("Conectividade TCP com MySQL confirmada.")
          except (OSError, ValueError) as exc:
              print(
                  "::error::Nao foi possivel conectar ao MySQL a partir do runner. "
                  "Verifique VPN, firewall, regras do RDS e origem da rede "
                  f"({type(exc).__name__}). "
                  "Se o RDS so aceitar a rede interna, utilize um runner "
                  "self-hosted com acesso autorizado, em vez de abrir a porta "
                  "3306 para a internet."
              )
              sys.exit(1)
          PY

      - name: Instalar dependências
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Atualizar indicadores
        working-directory: backend
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_CHARSET: ${{ secrets.DB_CHARSET }}
          DB_SSL: "false"
          DB_SSL_CA: ""

          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_SSLMODE: ${{ secrets.SUPABASE_DB_SSLMODE }}

        run: |
          python scripts/sincronizar_indicadores.py --modo diario

      - name: Atualizar snapshots padrao dos dashboards
        working-directory: backend
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_CHARSET: ${{ secrets.DB_CHARSET }}
          DB_SSL: "false"
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_SSLMODE: ${{ secrets.SUPABASE_DB_SSLMODE }}
        run: |
          python scripts/atualizar_snapshots_dashboard.py
